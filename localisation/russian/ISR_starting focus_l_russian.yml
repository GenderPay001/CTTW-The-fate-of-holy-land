l_russian:
 ISR_new_year_new_problems:0 "Новый год - новые проблемы"
 ISR_new_year_new_problems_desc:0 "Израиль уже далёк от своей былой мощи, мы каждый день пытаемся всё исправить, но каждый раз всё становится только хуже, но как говорится, Надежда умирает последней" 
 ISR_save_the_economy:0 "Спасти Экономику"
 ISR_save_the_economy_desc:0 "Вечно в таком состоянии мы находится не можем. Наша партия начнёт спустя 6 лет разрабатывать полноценный план перезагрузки экономики, и дальнейшего роста"
 ISR_invite_european_corporation:0 "Пытаться помочь бедным"
 ISR_invite_european_corporation_desc:0 "пока план разрабатывается, мы сделаем небольшую благотворительную кампанию на поддержку бедных слоёв населения"
 ISR_2_democracy_lighthouse:0 "2 маяка демократии"
 ISR_2_democracy_lighthouse_desc:0 "Израиль всегда был главным маяком демократии, хоть сейчас мы уже не сияем так как раньше, мы всё ещё даем свет демократии, теперь вместе с ЕЭК"
 ISR_form_defensive_pact:0 "Сформировать оборонный пакт"
 ISR_form_defensive_pact_desc:0 "Для защиты нашего суверенитета и демократии на ближнем востоке, нам необходимо сформировать собственный альянс, от ЕЭК помощи ждать смысла нет, мы не настолько их интерисуем"
 ISR_crush_the_resistance:0 "Подавить сопротивление"
 ISR_crush_the_resistance_desc:0 "Террористы есть террористы, словно стервятники окружили умирающее тело нашего государства, с ними только один разговор \n\n     всех мочить в сортире"
 ISR_incrase_patriotism:0 "Усилить патриотизм"
 ISR_incrase_patriotism_desc:0 "Столб нашей независимости - молодое поколение готовое воевать за свою страну, не смотря на ситуацию в стране, мы всё ещё можем воспитать в молодёже патриота через социальные сети, и интернет в целом"
 ISR_give_the_speech:0 "Выйти с речью"
 ISR_give_the_speech_desc:0 "Народ требует реформ, протесты всё сильнее душат нашу администрацию,не дадим ответы сейчас, не сможем дать их уже никогда. \n\n     Да и в конце концов, \n     что может пойти не так?"
