l_russian:
 LOADING_TIP_0: "«Зачем нам такой мир, если там не будет России?»\n- Владимир Путин"
 LOADING_TIP_1: "«Мы попадем в рай, а они просто сдохнут».\n- Владимир Путин"
 LOADING_TIP_2: "«Границы России нигде не заканчиваются».\n- Владимир Путин"
 LOADING_TIP_3: "«Денег нет, но вы держитесь».\n- Дмитрий Медведев"
 LOADING_TIP_4: "«Шойгу! Герасимов! Где боеприпасы?!»\n- Евгений Пригожин"
 LOADING_TIP_5: "«Там, где торжествует серость, к власти всегда приходят черные».\n- Аркадий и Борис Стругацкие"
 LOADING_TIP_6: "«Хотели как лучше, а получилось как всегда».\n- Виктор Черномырдин"
 LOADING_TIP_7: "«Никогда такого не было, и вот опять».\n- Виктор Черномырдин"
 LOADING_TIP_8: "«Берите суверенитета столько, сколько сможете проглотить».\n- Борис Ельцин"
 LOADING_TIP_9: "«Я устал, я ухожу».\n- Борис Ельцин"
 LOADING_TIP_10: "«Дайте мне набрать роту из детей элиты, и война закончится через день».\n- Александр Лебедь"
 LOADING_TIP_11: "«Коней на переправе не меняют, а ослов можно и нужно».\n- Александр Лебедь"
 LOADING_TIP_12: "«Гражданская война — это когда один брат стреляет в другого, а выигрывает третий».\n- Александр Лебедь"
 LOADING_TIP_13: "«В чем сила, брат? Я думаю, что сила в правде».\n- Сергей Бодров-младший"
 LOADING_TIP_14: "«Пластмассовый мир победил. Макет оказался сильней».\n- Егор Летов"
 LOADING_TIP_15: "«А при коммунизме всё будет заебись, он наступит скоро, надо только подождать».\n- Егор Летов"
 LOADING_TIP_16: "«Если выпало в Империи родиться, лучше жить в глухой провинции у моря».\n- Иосиф Бродский"
 LOADING_TIP_17: "«Родина — это не жопа президента, которую надо мусолить и целовать».\n- Юрий Шевчук"
 LOADING_TIP_18: "«Россия — это сфинкс. Закон и порядок здесь исторически не приживаются».\n- Александр Блок"
 LOADING_TIP_19: "«У России два союзника — армия и флот».\n- Александр III"
 LOADING_TIP_20: "«Кто контролирует прошлое — контролирует будущее, кто контролирует настоящее — контролирует прошлое».\n- Джордж Оруэлл"
 LOADING_TIP_21: "«Если вам нужен образ будущего, вообразите сапог, наступающий на человеческое лицо — вечно».\n- Джордж Оруэлл"
 LOADING_TIP_22: "«Война — это мир. Свобода — это рабство. Невежество — это сила».\n- Джордж Оруэлл"
 LOADING_TIP_23: "«Все животные равны, но некоторые животные равны более других».\n- Джордж Оруэлл"
 LOADING_TIP_24: "«Я не знаю, каким оружием будет вестись Третья мировая война, но Четвертая будет вестись палками и камнями».\n- Альберт Эйнштейн"
 LOADING_TIP_25: "«Я стал Смертью, разрушителем миров».\n- Роберт Оппенгеймер"
 LOADING_TIP_26: "«Мы знали, что мир уже не будет прежним».\n- Роберт Оппенгеймер"
 LOADING_TIP_27: "«Лишь мертвые видели конец войны».\n- Платон"
 LOADING_TIP_28: "«Война слишком серьезное дело, чтобы доверять ее военным».\n- Жорж Клемансо"
 LOADING_TIP_29: "«Патриотизм — последнее убежище негодяя».\n- Сэмюэл Джонсон"
 LOADING_TIP_30: "«Естественное состояние человечества — это война всех против всех».\n- Томас Гоббс"
 LOADING_TIP_31: "«Человек человеку — волк».\n- Плавт"
 LOADING_TIP_32: "«Ад — это другие».\n- Жан-Поль Сартр"
 LOADING_TIP_33: "«Строгость российских законов смягчается необязательностью их исполнения».\n- Михаил Салтыков-Щедрин"
 LOADING_TIP_34: "«Если я усну и проснусь через сто лет и меня спросят, что сейчас происходит в России, я отвечу: пьют и воруют».\n- Приписывается Михаилу Салтыкову-Щедрину"
 LOADING_TIP_35: "«Умом Россию не понять, аршином общим не измерить».\n- Фёдор Тютчев"
 LOADING_TIP_36: "«Нам нужны великие потрясения, вам нужна Великая Россия».\n- Пётр Столыпин"
 LOADING_TIP_37: "«Дайте государству двадцать лет покоя, внутреннего и внешнего, и вы не узнаете нынешней России».\n- Пётр Столыпин"
 LOADING_TIP_38: "«Никогда не замышляйте ничего против России, потому что на каждую вашу хитрость она ответит своей непредсказуемой глупостью».\n- Отто фон Бисмарк"
 LOADING_TIP_39: "«Русские медленно запрягают, но быстро едут».\n- Отто фон Бисмарк"
 LOADING_TIP_40: "«Война — это способ богатых людей защитить свои интересы, посылая на смерть бедных».\n- Джон Ф. Кеннеди"
 LOADING_TIP_41: "«Человечество должно покончить с войной, или война покончит с человечеством».\n- Джон Ф. Кеннеди"
 LOADING_TIP_42: "«Ни один план не переживает встречи с противником».\n- Хельмут фон Мольтке"
 LOADING_TIP_43: "«Победа имеет тысячу отцов, а поражение всегда сирота».\n- Джон Ф. Кеннеди"
 LOADING_TIP_44: "«Война — это ад».\n- Уильям Текумсе Шерман"
 LOADING_TIP_45: "«Если бы наши солдаты понимали, из-за чего мы воюем, нельзя было бы вести ни одной войны».\n- Фридрих Великий"
 LOADING_TIP_46: "«Единственное, чего мы должны бояться — это самого страха».\n- Франклин Д. Рузвельт"
 LOADING_TIP_47: "«История учит человека тому, что человек никогда ничему не учится у истории».\n- Георг Гегель"
 LOADING_TIP_48: "«Горе побежденным».\n- Бренн"
 LOADING_TIP_49: "«Разделяй и властвуй».\n- Приписывается Филиппу II Македонскому"
 LOADING_TIP_50: "«Деньги — нерв войны».\n- Цицерон"
 LOADING_TIP_51: "«Кто к нам с мечом придет, от меча и погибнет».\n- Приписывается Александру Невскому"
 LOADING_TIP_52: "«Тяжело в учении — легко в бою».\n- Александр Суворов"
 LOADING_TIP_53: "«Пуля — дура, штык — молодец».\n- Александр Суворов"
 LOADING_TIP_54: "«Сам погибай, а товарища выручай».\n- Александр Суворов"
 LOADING_TIP_55: "«Умереть за Родину — это почетно, но лучше сделать так, чтобы враг умер за свою».\n- Джордж Паттон"
 LOADING_TIP_56: "«У вас был выбор между войной и бесчестьем. Вы выбрали бесчестье, и вы получите войну».\n- Уинстон Черчилль"
 LOADING_TIP_57: "«Демократия — наихудшая форма правления, за исключением всех остальных».\n- Уинстон Черчилль"
 LOADING_TIP_58: "«Правда — первая жертва войны».\n- Хирам Джонсон"
 LOADING_TIP_59: "«Война — это просто продолжение политики другими средствами».\n- Карл фон Клаузевиц"
 LOADING_TIP_60: "«Цель оправдывает средства».\n- Приписывается Никколо Макиавелли"
 LOADING_TIP_61: "«Власть развращает, абсолютная власть развращает абсолютно».\n- Лорд Актон"
 LOADING_TIP_62: "«В окопах нет атеистов».\n- Уильям Томас Каммингс"
 LOADING_TIP_63: "«Революцию замышляют романтики, осуществляют фанатики, а ее плодами пользуются мерзавцы».\n- Томас Карлейль"
 LOADING_TIP_64: "«Политика есть концентрированное выражение экономики».\n- В. И. Ленин"
 LOADING_TIP_65: "«Государство — это аппарат насилия в руках господствующего класса».\n- В. И. Ленин"
 LOADING_TIP_66: "«Всякая революция лишь тогда чего-нибудь стоит, если она умеет защищаться».\n- В. И. Ленин"
 LOADING_TIP_67: "«Есть человек — есть проблема, нет человека — нет проблемы».\n- Приписывается Иосифу Сталину"
 LOADING_TIP_68: "«Кадры решают всё».\n- Иосиф Сталин"
 LOADING_TIP_69: "«Жить стало лучше, жить стало веселее».\n- Иосиф Сталин"
 LOADING_TIP_70: "«Если вы не занимаетесь политикой, политика займется вами».\n- Шарль де Монталламбер"
 LOADING_TIP_71: "«Если бы от выборов что-то зависело, нам бы не позволили в них участвовать».\n- Марк Твен"
 LOADING_TIP_72: "«Никто не забыт, ничто не забыто».\n- Ольга Берггольц"
 LOADING_TIP_73: "«Жить не по лжи».\n- Александр Солженицын"
 LOADING_TIP_74: "«Времена не выбирают, в них живут и умирают».\n- Александр Кушнер"
 LOADING_TIP_75: "«Время собирать камни, и время бросать камни».\n- Книга Экклезиаста"
 LOADING_TIP_76: "«Кто умножает познание, умножает скорбь».\n- Книга Экклезиаста"
 LOADING_TIP_77: "«Единственный способ справиться с несвободным миром — стать абсолютно свободным, чтобы само твое существование было актом бунта».\n- Альберт Камю"
 LOADING_TIP_78: "«Хоровод — это смысл бытия».\n- Александр Дугин"
 LOADING_TIP_79: "«Америка никогда не будет разрушена извне. Если мы пошатнемся и потеряем наши свободы, это произойдет потому, что мы разрушили себя сами».\n- Авраам Линкольн"
 LOADING_TIP_80: "«Европа будет создана через кризисы, и она будет суммой решений, принятых во время этих кризисов».\n- Жан Монне"
 LOADING_TIP_81: "«Я мыслю, следовательно, я существую».\n- Рене Декарт"
 LOADING_TIP_82: "«Высшее военное искусство — разрушить планы врага, затем — разрушить его союзы, и только потом — атаковать его армию».\n- Сунь-цзы"
 LOADING_TIP_83: "«Мы должны создать что-то вроде Соединенных Штатов Европы».\n- Уинстон Черчилль"
 LOADING_TIP_84: "«Моя главная цель в этой борьбе — спасти Союз, а не спасти или уничтожить рабство».\n- Авраам Линкольн"
 LOADING_TIP_85: "«Человек может делать то, что он желает, но не может желать по своему желанию».\n- Артур Шопенгауэр"
 LOADING_TIP_86: "«Человек — единственное существо, которое отказывается быть тем, что оно есть».\n- Альберт Камю"
 LOADING_TIP_87: "«В зоопарке все животные ведут себя пристойно, кроме обезьян. Чувствуется, что это уже без пяти минут люди».\n- Эмиль Чоран"
 LOADING_TIP_88: "«Добро есть в каждом. Поддерживайте его».\n- Калвин Кулидж, 30-й президент США"
 LOADING_TIP_89: "«Тот, кто сражается с чудовищами, должен беречься, чтобы самому не стать чудовищем».\n- Фридрих Ницше"
 LOADING_TIP_90: "«Западу нужен кто-то, кто сказал бы человеку, который ходит с самой большой палкой в мире, что эта палка не может разрушить дом Божий».\n- Саддам Хусейн"
 LOADING_TIP_91: "«Неважно, какого цвета кошка — черная или белая, хорошая кошка ловит мышей».\n- Дэн Сяопин"
 LOADING_TIP_92: "«Единая Европа не была создана, и мы получили войну».\n- Робер Шуман"
 LOADING_TIP_93: "«Индустриальная революция и ее последствия стали катастрофой для человечества».\n- Теодор Качинский"
 LOADING_TIP_94: "«Честь — это внешняя совесть, а совесть — это внутренняя честь».\n- Артур Шопенгауэр"
 LOADING_TIP_95: "«Свободен лишь тот, кто может не лгать».\n- Альберт Камю"
 LOADING_TIP_96: "«История имеет смысл только потому, что она кончится.».\n- Николай Бердяев"
 LOADING_TIP_97: "«Цивилизации умирают от самоубийства, а не от убийства».\n- Арнольд Тойнби"
 LOADING_TIP_98: "«Если мы не покончим с войной, война покончит с нами».\n- Герберт Уэллс"
 LOADING_TIP_99: "«Винтовка рождает власть».\n- Мао Цзэдун"
 LOADING_TIP_100: "«Цель — ничто, движение — всё».\n- Эдуард Бернштейн"
 LOADING_TIP_101: "«Хорошо, что война так ужасна, иначе мы бы полюбили её слишком сильно».\n- Роберт Э. Ли"
 LOADING_TIP_102: "«Патриотизм — это когда любовь к своим людям стоит на первом месте; национализм — это когда ненависть к чужим людям стоит на первом месте».\n- Шарль де Голль"
 LOADING_TIP_103: "«Насилию нечем прикрыться, кроме лжи, а лжи нечем удержаться, кроме как насилием».\n- Александр Солженицын"
 LOADING_TIP_104: "«Прогресс — это не случайность, а необходимость».\n- Герберт Спенсер"
 LOADING_TIP_105: "«То, что не убивает меня, делает меня сильнее».\n- Фридрих Ницше"
 LOADING_TIP_106: "«История — это кошмар, от которого я пытаюсь проснуться».\n- Джеймс Джойс"
 LOADING_TIP_107: "«Китай — это цивилизация, притворяющаяся нацией».\n- Люсьен Пай"
 LOADING_TIP_108: "«Смерть одного человека — это смерть, смерть двух миллионов — только статистика».\n- Эрих Мария Ремарк"
 LOADING_TIP_109: "«Конец истории не означает конец мировых конфликтов».\n- Фрэнсис Фукуяма"
 LOADING_TIP_110: "«Будущее принадлежит тем, кто готовится к нему сегодня».\n- Малькольм Икс"
 LOADING_TIP_111: "«Тяжелые времена рождают сильных людей. Сильные люди рождают хорошие времена».\n- Майкл Хопф"
 LOADING_TIP_112: "«Лучше умереть стоя, чем жить на коленях».\n- Долорес Ибаррури"
 LOADING_TIP_113: "«Всё смешалось в доме Облонских».\n- Лев Толстой"
 LOADING_TIP_114: "«Государство существует не для того, чтобы превратить земную жизнь в рай, а для того, чтобы она не превратилась в ад».\n- Николай Бердяев"
 LOADING_TIP_115: "«Какое дело трупу до того, кто был прав, а кто виноват?»"
 LOADING_TIP_116: "«Тьма, пришедшая со Средиземного моря, накрыла ненавидимый прокуратором город».\n- Михаил Булгаков"
 LOADING_TIP_117: "«Самый быстрый способ закончить войну — проиграть ее».\n- Джордж Оруэлл"
 LOADING_TIP_118: "«Каждый раз, когда я слышу политическую речь или читаю её, я ужасаюсь, что не нахожу там ничего человеческого».\n- Альберт Камю"
 LOADING_TIP_119: "«Всякая Россия наш сад. Земля велика и прекрасна, есть на ней много чудесных мест».\n- Антон Чехов"
 LOADING_TIP_120: "«Когда Китай проснется, мир содрогнется».\n- Приписывается Наполеону Бонапарту"
 LOADING_TIP_121: "«Те, кто готовы пожертвовать насущной свободой ради малой толики временной безопасности, не достойны ни свободы, ни безопасности».\n- Бенджамин Франклин"
 LOADING_TIP_122: "«Власть — это не средство, это цель».\n- Джордж Оруэлл"
 LOADING_TIP_123: "«Европа — это цветущий сад. Большинство остального мира — это джунгли. А джунгли могут вторгнуться в сад».\n- Жозеп Боррель"
 LOADING_TIP_124: "«Технологии обогнали нашу гуманность».\n- Альберт Эйнштейн"
 LOADING_TIP_125: "«Вне государства — господство страстей, война, страх, бедность, мерзость, одиночество, варварство».\n- Томас Гоббс"
 LOADING_TIP_126: "«Мы являемся как бы исключением среди народов. Мы принадлежам к тем из них, которые как бы не входят в состав человечества».\n- Пётр Чаадаев"
 LOADING_TIP_127: "«Там, где кончается государство, начинается человек».\n- Фридрих Ницше"
 LOADING_TIP_128: "«Всякая война основана на обмане».\n- Сунь-цзы"
 LOADING_TIP_129: "«Первое правило на первой же странице учебника военного искусства гласит: “Не ходи маршем на Москву”».\n- Бернард Монтгомери"
 LOADING_TIP_130: "«Империализм и все реакционеры — бумажные тигры».\n- Мао Цзэдун"
 LOADING_TIP_131: "«Всё, чего мы просим — это чтобы нас оставили в покое».\n- Джефферсон Дэвис"
 LOADING_TIP_132: "«Национализм — это детская болезнь, корь человечества».\n- Альберт Эйнштейн"
 LOADING_TIP_133: "«Мы живем в эпоху, когда безумцы руководят слепыми».\n- Уильям Шекспир"
 LOADING_TIP_134: "«Политика — это искусство удерживать людей от участия в делах, которые их касаются».\n- Поль Валери"
 LOADING_TIP_135: "«У тебя есть враги? Хорошо. Значит, ты хоть раз в жизни за что-то боролся».\n- Уинстон Черчилль"
 LOADING_TIP_136: "«Это не мир, это перемирие на двадцать лет».\n- Фердинанд Фош"
 LOADING_TIP_137: "«Единая Европа была мечтой нескольких человек. Она стала необходимостью для всех нас».\n- Конрад Аденауэр"
 LOADING_TIP_138: "«Если хочешь мира, готовься к войне».\n- Флавий Вегеций Ренат"
 LOADING_TIP_139: "«Либерализм — это абсолютное зло».\n- Александр Дугин"
 LOADING_TIP_140: "«Мир погубят не те, кто творит зло, а те, кто смотрит на это, сложив руки».\n- Альберт Эйнштейн"
 LOADING_TIP_141: "«Мы сделали работу за дьявола».\n- Роберт Оппенгеймер"
 LOADING_TIP_142: "«У человечества нет никакой цели, никакой идеи. Человечество — это пустое слово. Есть множество мощных культур, у каждой своя идея, своя жизнь и своя смерть».\n- Освальд Шпенглер."
 LOADING_TIP_143: "«Правительство, созданное народом, волей народа и для народа, не исчезнет с лица земли».\n- Авраам Линкольн"
 LOADING_TIP_144: "««Знаю одно и скажу вам по секрету, что если Россия будет спасена, то только как евразийская держава и только через евразийство».\n- Лев Гумилев"
 LOADING_TIP_145: "«Богатство подобно морской воде: чем больше ее пьешь, тем сильнее жажда».\n- Артур Шопенгауэр"
 LOADING_TIP_146: "«Мы не отбрасываем Запад, мы избавляемся от гегемонии либеральных элит.».\n- Александр Дугин"
 LOADING_TIP_147: "«Абсурд рождается из столкновения человеческого разума и безмолвия мира».\n- Альберт Камю"
 LOADING_TIP_148: "«Я видел войну. Я ненавижу войну».\n- Франклин Д. Рузвельт"
 LOADING_TIP_149: "«Абсолютно необходимо создание федерального союза между народами Европы, который положит конец анархии и обеспечит прочный мир, основанный на законе и справедливости».\n- Альтьеро Спинелли"
 LOADING_TIP_150: "«Мы любим Европу, но мы просто ненавидим Европейский союз».\n- Найджел Фарадж"
 LOADING_TIP_151: "«Европейский союз — это не Европа. Это тоталитарная мечта... Я хочу, чтобы Франция оставалась свободной нацией с собственными границами».\n- Марин Ле Пен"
 LOADING_TIP_152: "«Тоталитаризм стремится не к деспотическому господству над людьми, а к системе, в которой люди становятся лишними».\n- Ханна Арендт"
 LOADING_TIP_153: "«Есть десятилетия, когда ничего не происходит, и недели, за которые происходят десятилетия».\n- Владимир Ленин"
 LOADING_TIP_154: "«Каждый человек видит пределы своего кругозора как пределы мира».\n- Артур Шопенгауэр"
 LOADING_TIP_155: "«В демократии сила Урала».\n- Валентин Гальцев"
 LOADING_TIP_156: "«Посреди зимы я в конце концов понял, что внутри меня скрывается непобедимое лето».\n- Альберт Камю"
 LOADING_TIP_157: "«Жизнь человека в естественном состоянии одинока, бедна, беспросветна, тупа и кратковременна».\n- Томас Гоббс"
 LOADING_TIP_158: "«Убогий человек, не имеющий ничего, чем бы он мог гордиться, хватается за единственно возможное и гордится нацией, к которой он принадлежит».\n- Артур Шопенгауэр"
 LOADING_TIP_159: "«Больше всего толпа ненавидит того, кто думает иначе. Дело не столько в самом мнении, сколько в дерзости желания думать самостоятельно, чего она сама делать не умеет».\n- Артур Шопенгауэр"
 LOADING_TIP_160: ««Война была всегда. Она была еще до человека, война поджидала его. Основное ремесло поджидало своего основного исполнителя. Так было и так будет.»\n- Судья Холден из книги Кровавый Меридиан"
 LOADING_TIP_161: "«Война — это способ богатых стариков защитить свои интересы, посылая детей среднего и бедного классов на смерть.».\n- Джордж Карлин"
 LOADING_TIP_162: "«В Израиле, чтобы быть реалистом, нужно верить в чудеса».\n- Давид Бэн-Гурион"
 LOADING_TIP_163: "«Только осёл не меняет своего мнения.».\n- Моше Даян"
 LOADING_TIP_164: "«Мир заключают с врагами».\n- Моше Даян"
 LOADING_TIP_165: "«Правда в том, что если бы Израиль сложил оружие, не было бы больше Израиля. Если бы арабы сложили оружие, то не было бы больше войны.».\n- Бенджамин Нетаньяху"
 LOADING_TIP_166: "«Дьявол заключается в капитализме, в диктатуре. Всё это — дьявольские силы, пытающиеся поставить человека под свой контроль».\n- Муаммар Каддафи"
 LOADING_TIP_167: "«Той нации, чей национальный дух сломлен, суждено лежать в руинах.».\n- Муаммар Каддафи"