    ISR_resistance_of_arabs_desc:0 "\n\n\n\n\n£GFX_ISR_arab_resistance_banner\n\n\n\n\n\n\n\nТяжело назвать народы которые ненавидят друг-друга больше, чем Евреи и Арабы, тысячелетиями, они просто недолюбливали друг-друга, но всё изменилось с появлением государства Израиль. \nШесть Арабо-Израильских войн, тысяча террактов и сотни тысяч убитых жизней. \nвсе соседи нас ненавидят, а внутри страну раздирают террористические группировки\n\n----------------------------------------------------------------------\n\n£arab_texticon сила §GАра§!§Wбск§!§bого§! §tсопротивления§!: §R[?ISR_arab_res|-1%]\n§!\nэффект от сопротивления:\n\n§Yстабильность£stability_texticon: §R[?ISR_arab_res_stability|1%]§!\nприрост стабильности£stability_texticon: §R[?ISR_arab_res_stability_weekly|1%]§!\nрост сопротивления£resistance_texticon: §R[?ISR_arab_res_resistance_growth|1%]§!\nактивность сопротивления£resistance_texticon: §R[?ISR_arab_res_resistance_activity|1%]§!\nскорость строительства£GFX_construction_texticon: §R[?ISR_arab_res_construction_speed|1%]§!\n"