l_russian:

	ISR_start.1t:0 "Как мы пришли к этому?"
	ISR_start.1d:0 "В 2026 году, спустя некоторое время после начала Третьей мировой войны, 7 октября террористическая организация ХАМАС совершила нападение на территорию Израиля. В результате атаки около 1000 человек погибли, ещё около 1000 были взяты в заложники. \n\n В ответ Израиль начал военную операцию, заявленной целью которой стало освобождение заложников и установление контроля над палестинскими территориями. В ходе последующих боевых действий израильские вооружённые силы осуществили масштабные бомбардировки и наземные операции. Согласно оценкам, общее число погибших составило около 150 тысяч человек. \n\n На фоне конфликта арабские государства прекратили дипломатические отношения с Израилем и ввели против него ряд экономических и политических санкций. Израиль оказался в условиях международной изоляции и напряжённых отношений с большинством соседних государств. \n\n После окончания Третьей мировой войны мировой экономический и политический порядок столкнулся с масштабным кризисом. Израиль также оказался затронут последствиями войны. Экономическая нестабильность и ослабление государственных институтов привели к усилению влияния Европейской экономической кооперации (ЕЭК), которая стала одним из ключевых внешних факторов, определявших политику Израиля на Ближнем Востоке. \n\n После кризиса премьер-министр Биньямин Нетаньяху начал постепенно расширять полномочия исполнительной власти. Политические партии, выступавшие против проводимой военной политики, подвергались ограничениям и запретам. Массовые протесты против правительства неоднократно подавлялись силовыми структурами. \n\n К концу рассматриваемого периода политическая ситуация в Израиле оставалась нестабильной. Перспективы дальнейшего развития государства и его отношений с соседними странами оставались неопределёнными."
	ISR_start.1a:0 "Мы выдержим, надеюсь"
	ISR_start.2t:0 "Небольшая прогулка"
	ISR_start.2d:0 "Он медленно шёл по улицам Тель-Авива, глядя на знакомые здания. \n\n  Когда-то здесь всё было иначе. \n Кафе были переполнены, по дорогам проносились дорогие автомобили, а офисы небоскрёбов работали до глубокой ночи. Он сам часто бывал в этих местах. Когда-то у него была успешная компания, несколько офисов и десятки сотрудников. \n Он остановился возле старого ресторана. \n\n — Здесь мы праздновали заключение того контракта… — тихо произнёс он. \n\n Тогда никто не думал, что привычная жизнь может закончиться так быстро. \n Началась Третья мировая война. Израиль в ней не участвовал, но последствия войны не остановились у его границ. Нарушились торговые пути, рухнули рынки, исчезли привычные поставки, а мировая экономика начала стремительно погружаться в кризис. \n Его компания продержалась несколько месяцев.\n Потом пришлось закрыть первый офис. Затем второй. Вскоре не осталось и самой компании. \n Он посмотрел на улицу. Те же здания, те же дороги, то же море вдали. \n Но людей стало гораздо меньше. \n Он вспомнил, каким был Тель-Авив до войны: шумным, богатым и уверенным в завтрашнем дне. \n\n — Казалось, что так будет всегда… \n\n Мужчина ещё несколько секунд смотрел на город,"
	ISR_start.2a:0 "а затем продолжил свой путь."
	ISR_start.3t:0 "Всё только хуже"
	ISR_start.3d:0 "С каждым месяцем город становился всё беднее. \n Сначала это было почти незаметно. Цены в магазинах постепенно росли, некоторые товары исчезали с полок, а люди начали экономить на вещах, которые раньше даже не замечали. Но затем инфляция стала стремительной. \n\n Цены могли измениться за несколько дней, а иногда — за одну ночь. Зарплаты переставали успевать за стоимостью продуктов. Люди получали деньги и старались потратить их как можно быстрее, понимая, что через неделю они будут стоить гораздо меньше. \n Он проходил мимо небольшого магазина и увидел очередь. \n\n — Сколько стоит хлеб? — спросил кто-то впереди. \n\n Продавец назвал цену. \n Мужчина покачал головой и отошёл от прилавка. \n На улицах становилось всё больше бездомных. Люди, потерявшие работу и жильё, ночевали в подъездах и на станциях. Благотворительные пункты едва справлялись с потоком нуждающихся. \n\n Вместе с нищетой росла и преступность. \n По вечерам многие старались не выходить из дома. На улицах всё чаще встречались патрули, а магазины закрывались раньше обычного. То, что раньше казалось невозможным для спокойного Тель-Авива, постепенно становилось привычным. \n Он прошёл мимо закрытого банка. \n Когда-то через эти двери он заходил почти каждый день. Там лежали его деньги, обсуждались кредиты и заключались сделки. \n Теперь на окнах висела табличка: \n\n «Закрыто до дальнейшего уведомления». \n Он посмотрел на неё и усмехнулся. \n\n — Миллионы на счетах… А теперь я думаю, хватит ли денег на ужин. \n Он продолжил идти по улице. \n\n Где-то вдали слышались сирены, а возле магазина люди спорили из-за новых цен. "
	ISR_start.3a:0 "Выйдем ли мы когда-то из этого?"
	ISR_start.4t:0 "Протест в Иерусалиме"
	ISR_start.4d:0 " К вечеру Иерусалим заполнился протестующими. \n\n Экономический кризис, начавшийся после Третьей мировой войны, продолжался уже несколько лет. \nИзраиль официально не участвовал в войне, однако разрыв международных торговых связей и обвал мировой экономики тяжело ударили по стране. \nПравительство ввело чрезвычайные экономические меры: сократило государственные расходы, ограничило некоторые виды импорта и повысило налоги. \nИнфляция продолжала расти, а реальные доходы населения падали. \n\n На одной из площадей Иерусалима собрались тысячи людей.— Зарплаты заморозили, \n\n—цены растут каждую неделю! кричали из толпы.\n\n На плакатах были требования провести досрочные выборы, отменить часть чрезвычайных мер и увеличить государственную помощь семьям с низкими доходами. \nОппозиционные депутаты призывали правительство уйти в отставку, тогда как представители власти заявляли, что непопулярные решения необходимы для предотвращения ещё более тяжёлого экономического кризиса.\n\n К вечеру протест стал крупнейшим за последние месяцы.\nУ правительственных зданий появились усиленные подразделения полиции. Были установлены ограждения, перекрыты несколько улиц,\nа организаторам сообщили, что дальнейшее проведение митинга запрещено из-за «угрозы общественной безопасности». \n\n'— Мы имеем право быть здесь!' раздалось из толпы. \n\n В ответ включились громкоговорители: \n— Собрание объявлено незаконным. \nПросим всех участников немедленно покинуть площадь. \n\n Люди не расходились.\n\n После нескольких минут ожидания полицейские подразделения начали продвигаться вперёд. \nТолпа отступала, затем снова собиралась в плотные группы. \nНачались задержания организаторов и наиболее активных участников. \nНесколько улиц вокруг площади полностью перекрыли. \nКрики продолжались ещё долго. Затем площадь начала пустеть. \n\n На следующий день правительство заявило, что полиция предотвратила «дальнейшую эскалацию беспорядков». \nОппозиция назвала действия властей чрезмерными и потребовала парламентского расследования. \nВ центре Иерусалима остались только полицейские барьеры и разбросанные плакаты. \nНа одном из них было написано: «Мы не просим вернуть прошлое. Мы хотим будущее»."
	ISR_start.4a:0 "«Мы не просим вернуть прошлое. Мы хотим будущее»"
	ISR_start.5t:0 "ОПЕРАТИВНЫЙ ОТЧЁТ"
	ISR_start.5d:0 "Дата: [GetDateText] \nРайон проведения: населённый пункт в районе Хеврона \nЦель: освобождение заложников и установление контроля над объектом. \n\n В 04:40 оперативный центр получил информацию о возможном нахождении группы заложников в одном из зданий. По предварительным данным, объект контролировался вооружёнными членами ХАМАС.\nВ 05:15 подразделение прибыло в район проведения операции. Территория вокруг здания была оцеплена, после чего проведена дополнительная разведка объекта. \n\n—Командир: Все группы на позициях? \n\n—Боец: Так точно. Периметр установлен. \n\n После подтверждения информации о заложниках было принято решение о входе в здание. \nВ ходе операции подразделение обнаружило гражданских лиц и начало их эвакуацию. Одновременно внутри здания произошло вооружённое столкновение с членами ХАМАС. \n\n—Командир: Гражданских вывести первыми. Остальным группам продолжить зачистку помещений. \n\n В результате столкновения несколько вооружённых участников группировки были ликвидированы, ещё несколько задержаны. \nПосле этого подразделения продолжили проверку здания на наличие других вооружённых лиц. \n\n—Боец: Первый сектор проверен. Гражданских больше нет. \n\n—Командир: Принято. Продолжайте проверку.\n\n К 06:20 все обнаруженные заложники были выведены из здания и переданы медицинским службам. Им была оказана необходимая помощь. \nВ 06:30 активная фаза операции завершилась. Объект и прилегающая территория были проверены и взяты под контроль. \n\n Итог: заложники освобождены, несколько участников вооружённой группы ликвидированы, несколько задержаны. Объект взят под контроль. \nДополнительные обстоятельства операции устанавливаются. \n\n Статус операции: "
	ISR_start.5a:0 "ЗАВЕРШЕНА."
	ISR_start.6t:0 "Выступление"
	ISR_start.6d:0 "—'Господин премьер-министр, вам уже пора выходить' сказал один из спичрайтеров Нетаньяху.\n\n —'Я знаю, я знаю' с лёгким волнением ответил сам Нетаньяху. \n На площади его ждала хоть и злая, но пока спокойная толпа. Нетаньяху вышел к публике, подошёл к трибуне и начал свою речь: \n\n —'Дорогие граждане Государства Израиль! Эти годы выдались самыми тяжёлыми за всю историю нашей страны. Я понимаю ваше недовольство. Я…' \n Его речь начали слушать даже самые агрессивные люди в толпе. Все ждали, когда он скажет, что делать дальше. Его речь слушали и видели миллионы евреев по всему Израилю на своих экранах А один снайпер в это время наблюдал за происходящим через оптический прицел. \n\n —'Конец твоей диктатуре' прошептал стрелок. \n Не успел Нетаньяху объявить программу, как стрелок нажал на курок…"
	ISR_start.6a:0 "И пуля попала прямо в голову Премьер-Министра"

