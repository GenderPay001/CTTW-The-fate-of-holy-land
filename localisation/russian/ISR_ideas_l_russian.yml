 ISR_arab_resistance:0 "Арабское сопротивление"
 ISR_arab_resistance_desc:0 "Тяжело назвать народы которые ненавидят друг-друга больше, чем Евреи и Арабы, тысячелетиями, они просто недолюбливали друг-друга, но всё изменилось с появлением государства Израиль. Шесть Арабо-Израильских войн, тысяча террактов и сотни тысяч убитых жизней, может мы и начали ладить с соседями, но внутри страну всё ещё раздирают террористические группировки "
 stagnating_economy:0 "Стагнирующая экономика"
 stagnating_economy_desc:0 "Наша экономика уже как 4 года находится в стагнации, бизнесы закрываются один за другим, экономически мы постепенно становимся марионеткой ЕЭК, а рост бедности и преступности даже не думает останаваливаться. Если мы ничего не придпримем в ближайшее время, то кто знает, насколько всё станет хуже "

