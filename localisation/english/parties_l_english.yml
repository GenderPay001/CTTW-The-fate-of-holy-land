 idg_red_banditism_desc:0 "A system in which organized criminal groups use left-wing symbols, slogans, and goals to legitimize their activities. It combines criminal structures with revolutionary rhetoric, often invoking collectivism and anti-capitalism to justify redistributing wealth through robbery or extortion."
