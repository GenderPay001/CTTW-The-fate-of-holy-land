 idg_leftwing_military_junta_desc:0 "A military regime that uses army discipline and force to carry out socialist reforms, redistribute resources, and oppose imperialism."
 idg_nationalism:0 "Nationalism"
 idg_nationalism_desc:0 "An ideology that places the sovereignty, culture, and state interests of one’s nation at the center of domestic and foreign policy."
 idg_anarcho_primitivism:0 "Anarcho-Primitivism" 
 idg_anarcho_primitivism_desc:0 "A political ideology arguing that civilization and technology alienate people from nature, and that the ideal society can be achieved by returning to pre-industrial ways of life."
