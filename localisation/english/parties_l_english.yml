 idg_neovalkism:0 "Neovalkism"
 idg_neovalkism_desc:0 "A totalitarian ultranationalist regime combining absolute state control over the economy and society with radical cultural and technological progressivism, while replacing traditional faiths with a neo-pagan occult cult."
 idg_radical_satanism:0 "Radical Satanism"
