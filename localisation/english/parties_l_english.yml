l_english:
 communism:0 "Communism"
 communism_noun:0 "Communism"
 democratic:0 "Democracy"
 democratic_noun:0 "Democracy"
 fascism:0 "Fascism"
 fascism_noun:0 "Fascism"
 fascism_desc:0 "Totalitarian Regime"
 communism_desc:0 "Totalitarian Regime"
 democratic_desc:0 "Democratic regime"
 conservatism:0 "Conservatism"
 conservatism_desc:0 "Conservatives believe that rapid changes are harmful to society. They support traditional values and advocate moderate reforms, sometimes calling for a return to the good old days."
 liberalism:0 "Liberalism"
 liberalism_desc:0 "Liberalism is based on the long-standing philosophical tradition of respecting individual freedom and considers the protection of human rights to be the primary function of the state."
 socialism:0 "Socialism"
 socialism_desc:0 "Social Democrats advocate social equality, which they seek to achieve through reform. In their view, society should restrain the most extreme manifestations of capitalism."
 marxism:0 "Marxism"
 marxism_desc:0 "Marxism encompasses a broad range of economic and historical views. Marxist politicians seek to apply Marx’s ideas in social practice. What all Marxist ideologies share is recognition of class struggle and the need to transition to collective ownership."
 leninism:0 "Leninism"
 leninism_desc:0 "Leninism is an ideology based on Marxism whose main principles are the construction of a socialist state under the leadership of a vanguard party and world revolution aimed at overthrowing capitalist society. Within the party, differences of opinion and debate are possible before final decisions are made."
 stalinism:0 "Stalinism"
 stalinism_desc:0 "Stalinism can be defined as a development of Marxist-Leninist ideas and a form of authoritarian rule over a socialist state characterized by rapid industrialization and collectivization, as well as a struggle against counter-revolutionary elements."
 anti_revisionism:0 "Anti-Revisionism"
 anti_revisionism_desc:0 "Anti-Revisionism is a reaction to ideologies that claim to be successors of Marxism and an effort to adhere to the key principles of the original revolutionary theory. It primarily opposes the incorporation of capitalist economic elements into socialist states and defines itself through their rejection."
 anarchist_communism:0 "Anarcho-Communism"
 anarchist_communism_desc:0 "For anarcho-communists, communism is a classless society without a state. They reject the idea of a transitional socialist state and advocate a society based on voluntary association and mutual aid."
 nazism:0 "Nazism"
 nazism_desc:0 "The roots of Nazism lie in extreme nationalism and the belief in the superiority of the German nation. Nazis advocate aggressive territorial expansion and the creation of a totalitarian state whose citizens are united under a Führer with absolute power."
 gen_nazism:0 "Nazism"
 gen_nazism_desc:0 "The roots of National Socialism lie in extreme nationalism and the belief in racial superiority. It advocates aggressive territorial expansion and the creation of a totalitarian state whose citizens are united under a leader with absolute power."
 fascism_ideology:0 "Fascism"
 fascism_ideology_desc:0 "Fascism encompasses a variety of ultranationalist movements. It usually glorifies loyalty to the state and seeks to unite the nation under strong leadership."
 falangism:0 "Falangism"
 falangism_desc:0 "Falangism is an authoritarian ideology with elements of fascism and conservatism that emphasizes national and Catholic identity."
 rexism:0 "Rexism"
 rexism_desc:0 "Rexism opposes both liberal and communist ideologies. It is a strictly conservative nationalist movement that advocates a corporatist economic policy. Using populist and authoritarian rhetoric, it gradually draws closer to fascist movements."
 neutrality:0 "Neutrality"
 neutrality_noun:0 "Neutrality"
 neutrality_desc:0 "Authoritarian Regime"
 despotism:0 "Despotism"
 despotism_desc:0 "Despotism is a form of government in which absolute power belongs to a single person."
 oligarchism:0 "Oligarchy"
 oligarchism_desc:0 "A form of government in which power is concentrated in the hands of a small group of wealthy people."
 moderatism:0 "Moderateism"
 moderatism_desc:0 "Moderateism is a form of government that seeks to avoid both the far left and the far right by taking a politically moderate position."
 centrism:0 "Centrism"
 centrism_desc:0 "Centrism is a form of government that seeks practical solutions to the nation’s present and future needs without undermining public trust, while taking risks and context into account."
 anarchism:0 "Anarchism"
 anarchism_desc:0 "Anarchism is the rejection of all authority. It advocates dividing society into self-governing collectives rather than maintaining a centralized state."
