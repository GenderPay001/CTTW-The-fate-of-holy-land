l_english:
 ISR_new_year_new_problems:0 "A New Year, New Problems"
 ISR_new_year_new_problems_desc:0 "Israel is already far removed from its former strength. Every day we try to fix things, yet somehow they keep getting worse. But as they say, hope dies last." 
 ISR_save_the_economy:0 "Save the Economy"
 ISR_save_the_economy_desc:0 "We cannot remain in this state forever. Six years from now, our party will begin developing a comprehensive plan to rebuild the economy and return it to growth."
 ISR_invite_european_corporation:0 "Help the Poor"
 ISR_invite_european_corporation_desc:0 "While the plan is being developed, we will launch a small charitable campaign to support the poorest sections of society."
 ISR_2_democracy_lighthouse:0 "Two Beacons of Democracy"
 ISR_2_democracy_lighthouse_desc:0 "Israel has always been a leading beacon of democracy. Although we no longer shine as brightly as we once did, we still carry the light of democracy, now together with the EEC."
 ISR_form_defensive_pact:0 "Form a Defensive Pact"
 ISR_form_defensive_pact_desc:0 "To protect our sovereignty and democracy in the Middle East, we need to form our own alliance. There is little point in waiting for help from the EEC; we are simply not important enough to them."
 ISR_crush_the_resistance:0 "Suppress the Resistance"
 ISR_crush_the_resistance_desc:0 "Terrorists are terrorists. They circle our dying state like vultures, and there is only one way to deal with them. \n\n     We must defeat them all."
 ISR_incrase_patriotism:0 "Strengthen Patriotism"
 ISR_incrase_patriotism_desc:0 "The foundation of our independence is a younger generation willing to defend its country. Despite the situation in the country, we can still foster patriotism among young people through social media and the internet."
 ISR_give_the_speech:0 "Give a Speech"
 ISR_give_the_speech_desc:0 "The people are demanding reforms, and the protests are putting ever greater pressure on our administration. If we do not provide answers now, we may never get another chance. \n\n     Besides, what could possibly go wrong?"
