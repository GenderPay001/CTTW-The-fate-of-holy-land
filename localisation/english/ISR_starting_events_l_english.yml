l_english:

	ISR_start.1t:0 "How Did We Get Here?"
	ISR_start.1d:0 "In 2026, some time after the outbreak of the Third World War, the terrorist organization Hamas launched an attack on Israeli territory on October 7. Around 1,000 people were killed and another 1,000 were taken hostage. \n\n In response, Israel launched a military operation whose stated goals were to free the hostages and establish control over Palestinian territories. In the subsequent fighting, the Israeli armed forces carried out extensive airstrikes and ground operations. According to estimates, the overall death toll reached around 150,000. \n\n Against the backdrop of the conflict, Arab states severed diplomatic relations with Israel and imposed a number of economic and political sanctions. Israel found itself internationally isolated and in tense relations with most of its neighbors. \n\n After the end of the Third World War, the global economic and political order faced a major crisis. Israel was also affected by the consequences of the war. Economic instability and weakened state institutions increased the influence of the European Economic Cooperation (EEC), which became one of the key external factors shaping Israeli policy in the Middle East. \n\n Following the crisis, Prime Minister Benjamin Netanyahu gradually expanded the powers of the executive branch. Political parties opposing the government's military policy faced restrictions and bans. Mass protests against the government were repeatedly suppressed by security forces. \n\n By the end of the period in question, Israel's political situation remained unstable. The country's future development and its relations with neighboring states remained uncertain."
	ISR_start.1a:0 "We will endure, I hope"
	ISR_start.2t:0 "A Short Walk"
	ISR_start.2d:0 "He slowly walked through the streets of Tel Aviv, looking at the familiar buildings. \n\n Once, everything here had been different. \n Cafés had been packed, expensive cars had raced along the roads, and skyscraper offices had stayed open late into the night. He himself had often spent time in these places. Once, he had owned a successful company, several offices, and dozens of employees. \n He stopped outside an old restaurant. \n\n — This is where we celebrated signing that contract… — he said quietly. \n\n Back then, no one had imagined that ordinary life could end so quickly. \n The Third World War began. Israel did not participate in it, but the consequences of the war did not stop at its borders. Trade routes were disrupted, markets collapsed, familiar supplies disappeared, and the global economy began to plunge rapidly into crisis. \n His company lasted for several months.\nThen the first office had to close. Then the second. Soon, the company itself was gone. \n He looked at the street. The same buildings, the same roads, the same sea in the distance. \n But there were far fewer people. \n He remembered what Tel Aviv had been like before the war: noisy, prosperous, and confident about the future. \n — It seemed like it would always be this way… \n The man looked at the city for a few more seconds,"
	ISR_start.2a:0 "and then continued on his way."
	ISR_start.3t:0 "It Only Gets Worse"
	ISR_start.3d:0 "With each passing month, the city became poorer. \n At first, it was almost unnoticeable. Prices in stores gradually increased, some goods disappeared from the shelves, and people began saving money on things they had once taken for granted. Then inflation accelerated. \n\n Prices could change within days, sometimes overnight. Wages could no longer keep up with the cost of food. People received their money and tried to spend it as quickly as possible, knowing it would be worth much less a week later. \n He passed a small shop and saw a queue. \n\n — How much is the bread? — someone asked. \n\n The shopkeeper named the price. \n The man shook his head and stepped away from the counter. \n The number of homeless people on the streets kept growing. People who had lost their jobs and homes slept in entrances and at stations. Charities were barely able to cope with the number of people in need. \n\n Crime grew alongside poverty. \n In the evenings, many people tried not to leave their homes. Patrols became increasingly common, and shops closed earlier than usual. What had once seemed impossible in a peaceful Tel Aviv was gradually becoming normal.  He walked past a closed bank.  Once, he had entered through those doors almost every day. His money had been there; loans had been discussed and deals had been made.  Now a sign hung on the windows: \n\n “Closed until further notice.”  He looked at it and smiled bitterly. \n — Millions in my accounts… And now I'm wondering whether I can afford dinner.  He continued down the street. \n Somewhere in the distance, sirens could be heard, while people argued outside a shop about the latest price increases."
	ISR_start.3a:0 "Will we ever get out of this?"
	ISR_start.4t:0 "Protest in Jerusalem"
	ISR_start.4d:0 "By evening, Jerusalem was filled with protesters. \n\n The economic crisis that began after the Third World War had already lasted for several years. \n Israel had officially not participated in the war, but the collapse of international trade links and the global economy had hit the country hard.  The government introduced emergency economic measures: it cut public spending, restricted some imports, and raised taxes.  Inflation continued to rise while real incomes fell. \n Thousands of people gathered in one of Jerusalem's squares.  — Wages have been frozen, \n — prices are rising every week! people shouted from the crowd.\n\n The signs called for early elections, the repeal of some emergency measures, and increased government assistance for low-income families.  Opposition lawmakers called on the government to resign, while government representatives said the unpopular measures were necessary to prevent an even more severe economic crisis.\n\n By evening, the protest had become the largest in months.  Additional police units appeared around government buildings. Barricades were erected, several streets were closed, and organizers were informed that the rally was prohibited from continuing because of a “threat to public safety.” \n — We have the right to be here! someone shouted from the crowd. \n Loudspeakers responded:  — The gathering has been declared illegal.  All participants are requested to leave the square immediately. \n People did not disperse.\n\n After several minutes, police units began moving forward.  The crowd retreated and then regrouped in dense groups.  Organizers and some of the most active participants were detained.  Several streets around the square were completely closed.  The shouting continued for a long time. Then the square began to empty. \n The next day, the government stated that the police had prevented “further escalation of the unrest.”  The opposition called the authorities' actions excessive and demanded a parliamentary investigation.  Only police barriers and scattered signs remained in central Jerusalem.  One of them read: “We are not asking for the past to return. We want a future.”"
	ISR_start.4a:0 "“We are not asking for the past to return. We want a future.”"
	ISR_start.5t:0 "OPERATIONAL REPORT"
	ISR_start.5d:0 "Date: [GetDateText] \nArea of operation: a settlement in the Hebron area \nObjective: rescue hostages and secure the site. \n\n At 04:40, the operations center received information about a possible group of hostages inside a building. According to preliminary information, the site was controlled by armed Hamas members.\nAt 05:15, the unit arrived in the area of operations. The building was cordoned off, followed by additional reconnaissance of the site. \n\n—Commander: Are all groups in position? \n\n—Soldier: Yes, sir. Perimeter established. \n\n After the presence of hostages was confirmed, a decision was made to enter the building. \n During the operation, the unit located civilians and began evacuating them. At the same time, an armed confrontation with Hamas members took place inside the building. \n\n—Commander: Get the civilians out first. The other groups should continue clearing the rooms. \n\n Several armed members of the group were killed in the confrontation, while several others were detained. \n The units then continued searching the building for additional armed personnel. \n\n—Soldier: First sector checked. No more civilians. \n\n—Commander: Copy. Continue the search.\n\n By 06:20, all hostages who had been found were evacuated from the building and handed over to medical personnel. They received the necessary assistance. \n At 06:30, the active phase of the operation ended. The site and surrounding area were searched and secured. \n\n Result: hostages rescued, several members of the armed group killed, and several detained. The site was secured. \n Additional circumstances of the operation are being established. \n\n Operation status: "
	ISR_start.5a:0 "COMPLETED."
	ISR_start.6t:0 "The Speech"
	ISR_start.6d:0 "—“Mr. Prime Minister, it is time for you to go out,” one of Netanyahu's speechwriters said.\n\n —“I know, I know,” Netanyahu replied nervously. \n A crowd awaited him in the square. They were angry, but still calm. Netanyahu walked out to the public, approached the podium, and began his speech: \n\n —“Dear citizens of the State of Israel! These have been the most difficult years in our country's history. I understand your frustration. I…” \n Even the most aggressive people in the crowd began listening. Everyone was waiting to hear what would happen next. Millions of Israelis watched the speech on their screens across the country. Meanwhile, a sniper observed the scene from a distance. \n\n —“The end of your dictatorship,” the shooter whispered. \n Before Netanyahu could announce his program, the shooter pulled the trigger…"
	ISR_start.6a:0 "And the bullet struck the Prime Minister in the head."

