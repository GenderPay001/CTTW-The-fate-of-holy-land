 arab_resistance:0 "Arab Resistance"
 arab_resistance_desc:0 "It is difficult to name two peoples with a more troubled relationship than Jews and Arabs. For millennia, they lived alongside one another with mutual hostility, but everything changed with the establishment of the State of Israel. Six Arab-Israeli wars, thousands of terrorist attacks, and hundreds of thousands of deaths have left a deep mark. We may have begun to improve relations with our neighbors, but terrorist groups still tear the country apart. "
