 stagnating_economy:0 "Stagnant Economy"
 stagnating_economy_desc:0 "Our economy has been stagnating for four years. Businesses are closing one after another, we are gradually becoming economically dependent on the EEC, and poverty and crime continue to rise. If we do nothing soon, who knows how much worse the situation will become. "

